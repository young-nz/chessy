[workspace]
resolver = "2"
members = [
    "crates/chess_rules",
    "dnas/chessy/zomes/integrity/chessy_integrity",
    "dnas/chessy/zomes/coordinator/chessy",
    "dnas/chessy/tests",
]
default-members = [
    "crates/chess_rules",
    "dnas/chessy/zomes/integrity/chessy_integrity",
    "dnas/chessy/zomes/coordinator/chessy",
]

[workspace.package]
edition = "2021"
license = "CAL-1.0"
version = "0.1.0"

[workspace.dependencies]
hdi = "=0.8.1"
hdk = "=0.7.1"
holochain_serialized_bytes = "=0.0.57"
holochain = { version = "=0.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
shakmaty = "=0.27.3"
thiserror = "=1.0.69"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
chess_rules = { path = "crates/chess_rules" }
chessy_integrity = { path = "dnas/chessy/zomes/integrity/chessy_integrity" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
